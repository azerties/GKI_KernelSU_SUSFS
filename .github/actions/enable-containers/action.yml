name: 'Enable Containers & Docker Support'
description: 'Enables kernel configurations required for Docker, Podman, and LXC containers'

runs:
  using: composite
  steps:
    - name: Patch Defconfig for Containers & Docker
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # Cgroup Controllers & Limits (Generally Necessary & Optional)
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_PERF=y
          CONFIG_HUGETLBFS=y
          CONFIG_HUGETLB_PAGE=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_BLK_DEV_THROTTLING_LOW=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_FAIR_GROUP_SCHED=y

          # Bridge & Netfilter (Generally Necessary for Docker networking)
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_BRIDGE_VLAN_FILTERING=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_IP_VS_WRR=y
          CONFIG_IP_VS_SH=y

          # SCTP Protocol
          CONFIG_IP_SCTP=y

          # Modern NF_TABLES & Nftables Stack
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_INET=y
          CONFIG_NFT_CT=y
          CONFIG_NFT_FIB=y
          CONFIG_NFT_FIB_IPV4=y
          CONFIG_NFT_FIB_IPV6=y
          CONFIG_NFT_FIB_INET=y
          CONFIG_NFT_MASQ=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_REJECT=y
          CONFIG_NFT_REJECT_INET=y
          CONFIG_NFT_COMPAT=y

          # Virtual Network Drivers (Overlay, IPVLAN, MACVLAN, VXLAN)
          CONFIG_VXLAN=y
          CONFIG_IPVLAN=y
          CONFIG_IPVTAP=y
          CONFIG_MACVLAN=y
          CONFIG_MACVTAP=y

          # Storage Drivers (Btrfs)
          CONFIG_BTRFS_FS=y
          CONFIG_BTRFS_FS_POSIX_ACL=y
