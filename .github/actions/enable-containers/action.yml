name: 'Enable Containers & Docker Support'
description: 'Enables kernel configurations required for Docker, Podman, and LXC containers'

runs:
  using: composite
  steps:
    - name: Patch Defconfig for Containers & Docker
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # Cgroup Controllers & Limits (Generally Necessary & Optional)
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_FAIR_GROUP_SCHED=y

          # Explicitly disable configs known to hang Tensor G3 early boot / MM / UFS
          CONFIG_HUGETLBFS=n
          CONFIG_HUGETLB_PAGE=n
          CONFIG_CGROUP_HUGETLB=n
          CONFIG_BLK_DEV_THROTTLING=n
          CONFIG_BLK_DEV_THROTTLING_LOW=n
          CONFIG_BLK_CGROUP_PUNT_BIO=n
          CONFIG_PADATA=n
          CONFIG_DAMON=n
          CONFIG_DAMON_VADDR=n
          CONFIG_DAMON_PADDR=n
          CONFIG_DAMON_SYSFS=n
          CONFIG_BTRFS_FS=n
          CONFIG_BTRFS_FS_POSIX_ACL=n

          # Disable Samsung Knox-specific KDP/RKP/DEFEX for Google Pixel / generic GKI
          CONFIG_KSU_SAMSUNG_KDP=n
          CONFIG_KSU_SAMSUNG_RKP=n
          CONFIG_KSU_SAMSUNG_DEFEX=n
          CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=n

          # Bridge & Netfilter (Generally Necessary for Docker networking)
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_BRIDGE_VLAN_FILTERING=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_IP_VS_WRR=y
          CONFIG_IP_VS_SH=y

          # SCTP Protocol
          CONFIG_IP_SCTP=y

          # Modern NF_TABLES & Nftables Stack
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_INET=y
          CONFIG_NFT_CT=y
          CONFIG_NFT_FIB=y
          CONFIG_NFT_FIB_IPV4=y
          CONFIG_NFT_FIB_IPV6=y
          CONFIG_NFT_FIB_INET=y
          CONFIG_NFT_MASQ=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_REJECT=y
          CONFIG_NFT_REJECT_INET=y
          CONFIG_NFT_COMPAT=y

          # Virtual Network Drivers (Overlay, IPVLAN, MACVLAN, VXLAN)
          CONFIG_VXLAN=y
          CONFIG_IPVLAN=y
          CONFIG_IPVTAP=y
          CONFIG_MACVLAN=y
          CONFIG_MACVTAP=y
