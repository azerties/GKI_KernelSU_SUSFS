name: 'Enable Google Wonder Driver'
description: 'Injects Google Wonder mac80211 driver for Android Mosey (AirDrop) and enables cfg80211/mac80211'

inputs:
  version:
    description: 'Kernel config version (e.g. android16-6.12)'
    required: true

runs:
  using: composite
  steps:
    - name: Patch Defconfig for Wireless & Wonder
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_CFG80211=y
          CONFIG_CFG80211_DEFAULT_PS=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_RC_MINSTREL=y
          CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
          CONFIG_MAC80211_STA_HASH_MAX_SIZE=0
          CONFIG_LIBARC4=y
          CONFIG_CRYPTO_LIB_ARC4=y
          CONFIG_ANDROID_WONDER=y

    - name: Inject Wonder Driver Source
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        echo "Injecting Google Wonder driver into drivers/wonder..."
        mkdir -p drivers/wonder
        cp "${{ github.action_path }}/wonder.c" drivers/wonder/wonder.c
        
        cat << 'EOF' > drivers/wonder/Makefile
        obj-$(CONFIG_ANDROID_WONDER) += wonder.o
        EOF

        cat << 'EOF' > drivers/wonder/Kconfig
        config ANDROID_WONDER
        	tristate "Google Wonder WiFi Virtual Device Driver"
        	depends on MAC80211
        	default y
        	help
        	  Virtual Soft-MAC driver for Google Mosey AirDrop support.
        EOF

        if [ -f drivers/Kconfig ] && ! grep -q "drivers/wonder/Kconfig" drivers/Kconfig; then
          sed -i '/endmenu/i source "drivers/wonder/Kconfig"' drivers/Kconfig || echo 'source "drivers/wonder/Kconfig"' >> drivers/Kconfig
        fi

        if [ -f drivers/Makefile ] && ! grep -q "obj-\$(CONFIG_ANDROID_WONDER)" drivers/Makefile; then
          echo 'obj-$(CONFIG_ANDROID_WONDER) += wonder/' >> drivers/Makefile
        fi

        # Patch BUILD.bazel to declare module_outs for Kleaf
        if [ -f "BUILD.bazel" ]; then
          echo "Patching BUILD.bazel for wonder/wireless module_outs..."
          python3 - << 'PYEOF'
import re

with open("BUILD.bazel", "r") as f:
    content = f.read()

outs_insert = '    module_outs = ["drivers/wonder/wonder.ko", "net/mac80211/mac80211.ko", "net/wireless/cfg80211.ko"],\n'

for name in ["kernel_aarch64", "kernel_aarch64_16k"]:
    pattern = rf'(name\s*=\s*"{name}",\n)'
    if re.search(pattern, content):
        content = re.sub(pattern, rf'\1{outs_insert}', content)

with open("BUILD.bazel", "w") as f:
    f.write(content)
print("BUILD.bazel patched successfully with module_outs!")
PYEOF
        fi

        echo "Wonder driver successfully integrated into kernel tree!"
